<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps by Boyan Tasevski</title>
<meta name="description" content="iPhone apps by Boyan Tasevski.">
<style>
:root{--bg:#ffffff;--text:#1d1d1f;--muted:#6e6e73;--rule:#e5e5ea;--accent:#0066cc;--card:#f5f5f7}
@media (prefers-color-scheme: dark){:root{--bg:#000000;--text:#f5f5f7;--muted:#a1a1a6;--rule:#2c2c2e;--accent:#2997ff;--card:#1c1c1e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:680px;margin:0 auto;padding:56px 16px 64px}
h1{font-size:34px;line-height:1.15;margin:0 0 32px;letter-spacing:-0.02em}
a.app{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:18px;padding:16px;color:var(--text);text-decoration:none}
a.app img{width:64px;height:64px;border-radius:15px;flex:none}
a.app strong{display:block;font-size:19px}
a.app span{color:var(--muted);font-size:15px}
footer{margin-top:48px;color:var(--muted);font-size:15px}
</style>
</head>
<body>
<main>
<h1>Apps by Boyan Tasevski</h1>
<a class="app" href="meals/">
  <img src="meals/icon.png" alt="" onerror="this.remove()">
  <div><strong>Meals: Nutrition &amp; Calories</strong><span>Calories, macros and a nutrition grade from a photo, a barcode or a label.</span></div>
</a>
<footer>Contact: <a href="mailto:boyantasevski.appstore@gmail.com">boyantasevski.appstore@gmail.com</a></footer>
</main>
</body>
</html>
